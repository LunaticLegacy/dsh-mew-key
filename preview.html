<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Mew Key — one-click preview</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 30% 0%,#2a2440 0%,#171927 52%,#111320 100%);color:#e9e9f6;font:14px/1.6 Inter,"Segoe UI",system-ui,sans-serif}
  .shell{max-width:720px;margin:0 auto;padding:32px 20px 40px;display:flex;flex-direction:column;gap:18px;min-height:100vh}
  h1{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:#e7b3d4;margin:0}
  .hint{font-size:12px;color:#8e93ad;margin:0}
  .thread{flex:1;display:flex;flex-direction:column;gap:10px;padding:18px 0}
  .msg{max-width:78%;padding:10px 13px;border-radius:14px;font-size:13px;line-height:1.65}
  .msg.user{align-self:flex-end;background:linear-gradient(180deg,#3a3f66,#33385c);color:#f2f2fb}
  .msg.agent{align-self:flex-start;background:#1e2133;border:1px solid #ffffff0f}
  .msg.agent b{color:#ffd4ea}

  .composer{position:relative;display:flex;flex-direction:column;gap:10px;border:1px solid #ffffff14;background:#191b28;border-radius:16px;padding:14px 12px 10px 16px}
  .composer-text{color:#6f7590;font-size:13px;min-height:44px}
  .composer-row{display:flex;align-items:center;gap:12px;min-width:0}
  .chip{appearance:none;border:1px solid #ffffff14;background:#ffffff08;color:#b9bed6;border-radius:9px;padding:5px 9px;font-size:12px;cursor:default;white-space:nowrap}
  .grow{flex:1}
  .model{border:1px solid #ffffff14;background:#ffffff08;color:#c8cde3;border-radius:9px;padding:5px 10px;font-size:12px;white-space:nowrap}
  .send{width:32px;height:32px;flex:none;border:0;border-radius:10px;background:#7e86ff;color:#111327;font-size:15px;cursor:pointer}

  .mew-key-seat{position:relative;display:inline-flex;align-items:center;justify-content:center;line-height:0}
  .mew-paw-fab{appearance:none;width:28px;height:28px;border:0;border-radius:999px;display:grid;place-items:center;cursor:pointer;color:#ffd4ea;background:linear-gradient(180deg,rgba(129,138,255,.92),rgba(104,109,236,.96));box-shadow:0 4px 12px rgba(19,22,52,.28),0 0 0 1px rgba(255,255,255,.08) inset;transition:transform .16s ease,filter .16s ease,box-shadow .16s ease}
  .mew-paw-fab:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.06);box-shadow:0 6px 16px rgba(19,22,52,.32),0 0 0 1px rgba(255,255,255,.12) inset,0 0 0 3px rgba(129,138,255,.12)}
  .mew-paw-fab:active:not(:disabled){transform:translateY(1px)}
  .mew-paw-fab:focus-visible{outline:2px solid #f0a3d8;outline-offset:3px}
  .mew-paw-fab[data-busy=true]{cursor:progress;background:linear-gradient(180deg,rgba(246,151,203,.96),rgba(225,113,188,.96));animation:mew-paw-pulse .9s ease-in-out infinite}
  .mew-paw-fab svg{width:16px;height:16px;filter:drop-shadow(0 2px 6px rgba(41,26,76,.24))}
  .mew-toast{position:absolute;right:0;bottom:calc(100% + 8px);width:max-content;max-width:232px;border-radius:12px;padding:7px 10px;font-size:11px;line-height:1.45;border:1px solid rgba(255,255,255,.08);background:linear-gradient(165deg,rgba(33,35,57,.96),rgba(22,24,40,.98));backdrop-filter:blur(14px);box-shadow:0 14px 34px rgba(0,0,0,.35);animation:mew-toast-in .18s ease-out}
  .mew-toast[data-kind=success]{color:#cbf4df}
  .mew-toast[data-kind=error]{color:#ffc3cc}
  @keyframes mew-paw-pulse{0%,100%{transform:scale(1)}50%{transform:scale(.9)}}
  @keyframes mew-toast-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  @media(prefers-reduced-motion:reduce){.mew-paw-fab,.mew-toast{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="shell">
  <h1>Mew Key · 一键预览</h1>
  <p class="hint">静态预览，不连接 DSH。猫爪在输入框工具栏内、模型选择器左边、与发送键同一行。单击 = 温和插话；<kbd>Shift</kbd>+点击 = 先中断再喵。</p>

  <div class="thread" id="thread">
    <div class="msg user">帮我把 tests 里的 mock 换成真实 fixture。</div>
    <div class="msg agent">正在看 <code>tests/bridge.test.mjs</code>，先确认现有 mock 覆盖了哪些调用……</div>
  </div>

  <div class="composer">
    <div class="composer-text">输入消息…</div>
    <div class="composer-row">
      <button class="chip" type="button">＋</button>
      <span class="chip">工作区内修改</span>
      <div class="grow"></div>
      <div class="mew-key-seat">
        <div id="toast"></div>
        <button class="mew-paw-fab" id="paw" type="button" aria-label="喵一下" title="喵一下（Shift+点击：先中断再喵）">
          <svg viewBox="0 0 96 96" fill="none" aria-hidden="true">
            <path d="M29 55C23 61 18 66 19 74c2 10 12 11 21 7 5-2 11-2 16 0 9 4 20 3 22-7 2-8-4-14-11-20-8-7-13-17-20-17-8 0-12 11-18 18Z" fill="currentColor"/>
            <ellipse cx="20" cy="39" rx="9" ry="13" transform="rotate(-19 20 39)" fill="currentColor"/>
            <ellipse cx="41" cy="24" rx="9" ry="13" transform="rotate(-7 41 24)" fill="currentColor"/>
            <ellipse cx="64" cy="27" rx="9" ry="13" transform="rotate(17 64 27)" fill="currentColor"/>
            <ellipse cx="81" cy="45" rx="8" ry="12" transform="rotate(30 81 45)" fill="currentColor"/>
          </svg>
        </button>
      </div>
      <button class="model" type="button">DeepSeek-V4.1-Flash · High</button>
      <button class="send" type="button" aria-label="发送">↑</button>
    </div>
  </div>
</div>
<script>
  const thread = document.getElementById('thread')
  const paw = document.getElementById('paw')
  const toastBox = document.getElementById('toast')
  let timer, busy = false

  function say(text, kind){
    clearTimeout(timer)
    toastBox.className = 'mew-toast'
    toastBox.dataset.kind = kind
    toastBox.setAttribute('role', kind === 'error' ? 'alert' : 'status')
    toastBox.textContent = (kind === 'error' ? '操作未完成：' : '✧ ') + text
    timer = setTimeout(() => { toastBox.textContent = ''; toastBox.className = '' }, 2800)
  }

  function bubble(html){
    const el = document.createElement('div')
    el.className = 'msg agent'
    el.innerHTML = html
    thread.appendChild(el)
  }

  paw.addEventListener('click', () => {
    if (busy) return
    busy = true
    paw.dataset.busy = 'true'
    paw.disabled = true
    setTimeout(() => {
      bubble('<b>喵～</b>正在把 tests 里的 mock 换成真实 fixture 呀。')
      say('喵～ 已插话：下一步会撒娇一声。', 'success')
      paw.dataset.busy = 'false'
      paw.disabled = false
      busy = false
    }, 550)
  })

  // 便于截图/演示：打开 preview.html#demo 会直接呈现「按过一次」的状态
  if (location.hash === '#demo') {
    bubble('<b>喵～</b>正在把 tests 里的 mock 换成真实 fixture 呀。')
    say('喵～ 已插话：下一步会撒娇一声。', 'success')
  }
</script>
</body>
</html>
